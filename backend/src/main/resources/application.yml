spring:
  application.name: forgeci-backend
  profiles.default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeci}
    username: ${SPRING_DATASOURCE_USERNAME:forgeci}
    password: ${SPRING_DATASOURCE_PASSWORD:forgeci_local}
  jpa.hibernate.ddl-auto: validate
  jpa.open-in-view: false
  flyway.enabled: true
  flyway.validate-on-migrate: true
  data.redis.host: ${SPRING_DATA_REDIS_HOST:localhost}
  data.redis.port: ${SPRING_DATA_REDIS_PORT:6379}
  data.redis.password: ${SPRING_DATA_REDIS_PASSWORD:redis_local}
  rabbitmq.host: ${SPRING_RABBITMQ_HOST:localhost}
  rabbitmq.port: ${SPRING_RABBITMQ_PORT:5672}
  rabbitmq.username: ${SPRING_RABBITMQ_USERNAME:forgeci}
  rabbitmq.password: ${SPRING_RABBITMQ_PASSWORD:rabbitmq_local}
management.endpoints.web.exposure.include: health,prometheus
management.endpoint.health.probes.enabled: true
management.health.livenessstate.enabled: true
management.health.readinessstate.enabled: true
server.port: ${BACKEND_PORT:8080}
forgeci:
  worker:
    docker-binary: ${FORGECI_WORKER_DOCKER_BINARY:docker}
    step-timeout-seconds: ${FORGECI_WORKER_STEP_TIMEOUT_SECONDS:1800}
  pipeline:
    scheduler-delay-ms: ${FORGECI_PIPELINE_SCHEDULER_DELAY_MS:1000}
    publisher-delay-ms: ${FORGECI_PIPELINE_PUBLISHER_DELAY_MS:500}
  auth:
    jwt-secret: ${FORGECI_JWT_SECRET:forgeci-local-development-secret-change-me-32}
    access-token-seconds: 900
    refresh-token-days: 30
  security:
    encryption-key: ${FORGECI_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/connections/github/callback}
    state-secret: ${GITHUB_STATE_SECRET:forgeci-local-github-state-secret-change-me-32}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
